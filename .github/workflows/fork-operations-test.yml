name: fork-operations-test

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/fork-*.yml'
  push:
    branches: [fleet]
    paths:
      - 'scripts/**'
      - '.github/workflows/fork-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
